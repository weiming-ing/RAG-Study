# =============================================================================
# RAG 助手 — 容器内 Nginx 配置（统一入口）
# =============================================================================
# 单一端口对外提供两套界面，避免客户把系统当成两个：
#   /         员工聊天页（frontend/，API 走同源相对路径 /api，无需跨域配置）
#   /admin/   管理台（Vue 构建产物，vite base = /admin/）
#   /api/     反向代理到 Python 后端（SSE 直通）
#
# 裸机/多实例部署请改用 deploy/nginx/rag-assistant.conf。
# =============================================================================

server {
    listen       80;
    server_name  _;

    charset utf-8;

    # 必须 ≥ 后端 MAX_FILE_SIZE（backend/routes/knowledge.py 中为 50M）。
    # Nginx 默认仅 1M，不改会导致管理台上传文档直接被 413 拒绝。
    client_max_body_size 100M;

    # 若需把页面嵌进客户 OA / 企业微信（跨域 iframe），
    # 请把 X-Frame-Options 换成按域名放行的 CSP：
    #   add_header Content-Security-Policy "frame-ancestors https://oa.customer.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    # ---------------------------------------------------------------------
    # 员工聊天页（根路径）
    # ---------------------------------------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # ---------------------------------------------------------------------
    # 管理台（/admin/）
    # 使用 root 而非 alias：/admin/x -> /usr/share/nginx/html/admin/x
    # （alias 与 try_files 组合有已知陷阱，用 root 更稳）
    # ---------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root  /usr/share/nginx/html;
        index index.html;
        # 前端路由（history 模式）回落到管理台自己的 index.html，
        # 不要落到根路径的聊天页，否则刷新管理台会串到聊天界面
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ---------------------------------------------------------------------
    # 缺失的第三方前端库直接 404。
    # 否则会被上面的 SPA 回落规则返回 index.html（HTTP 200 + HTML 内容），
    # 浏览器会把 HTML 当 JS 执行，报出难以定位的语法错误。
    # ---------------------------------------------------------------------
    location /vendor/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # API 反向代理
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：关闭缓冲，保证逐字返回
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ---------------------------------------------------------------------
    # 带指纹的静态资源（两套界面共用，可长缓存）
    # 正则 location 优先于前缀 location，因此 /admin/ 下的 asset 也走这里
    # ---------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # 健康检查（不依赖任何静态文件，供编排与监控使用）
    location = /health {
        access_log off;
        return 200 "OK\n";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
