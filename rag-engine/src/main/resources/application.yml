server:
  port: 8002
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 8192
    connection-timeout: 30000

spring:
  application:
    name: rag-engine
  profiles:
    active: dev

  # 本地（非 Docker）运行时从仓库根目录的 .env 读取配置；
  # Docker 环境由 compose 注入同名环境变量，故此导入为 optional。
  # ./ 对应 IDE / mvn spring-boot:run 从 rag-engine/ 启动的场景；
  # ../ 对应从项目根目录启动 jar 的场景。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rag_engine?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    # 不设默认值：未配置时启动即失败，避免回落到硬编码弱口令
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ragstudy.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 知识库配置
rag:
  embedding:
    model-path: classpath:models/onnx/model.onnx
    tokenizer-path: classpath:models/tokenizer.json
    dimension: 512
    batch-size: 32
  chunker:
    child-size: 300
    parent-size: 1000
    overlap: 50
  retrieval:
    top-k: 10
    vector-weight: 0.7
    bm25-weight: 0.3
    multi-hop-min-score: 0.4
    multi-hop-min-sources: 2
    rerank-top-k: 10
  bm25:
    index-path: ./data/bm25_index
    auto-rebuild: true
  qdrant:
    host: localhost
    port: 6334
    collection-name: rag_knowledge
    parent-collection-name: rag_knowledge_parent
    vector-size: 512
  cors:
    # 允许的前端来源，逗号分隔，支持通配（如 http://*.example.com）。
    # 生产环境必须显式改为真实域名，不要使用 *
    allowed-origins: ${CORS_ALLOW_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001,http://127.0.0.1:8001,http://localhost,http://127.0.0.1}
  internal:
    # 服务间接口 /api/internal/** 的共享令牌。
    # 不设默认值：未配置则 Java 启动失败，内部接口保持关闭（fail closed）
    token: ${INTERNAL_API_TOKEN:${INTERNAL_TOKEN:}}

jwt:
  # 兼容 JWT_SECRET (Docker Compose) 和 JWT_SECRET_KEY (Python .env) 两种变量名
  # 不设默认值：必须与 Python 的 JWT_SECRET_KEY 使用同一值
  secret: ${JWT_SECRET:${JWT_SECRET_KEY:}}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.ragstudy: DEBUG
    org.apache.lucene: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"