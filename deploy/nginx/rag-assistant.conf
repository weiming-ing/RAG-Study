# =============================================================================
# RAG 助手 — Nginx 反向代理 + 负载均衡（对外交付版）
# =============================================================================
# 用途：把前端请求负载均衡到多个 Python 后端实例，静态资源由 Nginx 直接托管。
#
# 安装位置：
#   Linux:   /etc/nginx/conf.d/rag-assistant.conf
#            （nginx.conf 的 http {} 中通常已有 include /etc/nginx/conf.d/*.conf）
#   Windows: conf/nginx.conf 的 http {} 中添加 include <此文件>
#
# 【重要】本文件必须被 include 在 http {} 内。
#   下面的 upstream 与 limit_req_zone 都是 http 级指令，放进 server {} 会导致
#   nginx -t 报 "directive is not allowed here"，服务根本起不来。
#
# 启动命令：
#   nginx -t          # 先测配置
#   nginx -s reload   # 再加载
#
# Python 实例启动（多实例时）：
#   python main.py            # 使用 .env 中的 PORT，默认 8001
#   PORT=8011 python main.py  # 工作实例 1
#   PORT=8012 python main.py  # 工作实例 2
# =============================================================================

upstream rag_python_backend {
    # least_conn：把请求分给活跃连接数最少的后端。
    # SSE 是长连接，round-robin 容易造成分配不均，故用 least_conn。
    least_conn;

    server 127.0.0.1:8001 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8011 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8012 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8013 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8014 weight=5 max_fails=3 fail_timeout=30s;
}

# http 级指令：必须放在 server 之外
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    # 交付时改成客户的实际域名
    server_name _;

    charset utf-8;

    # ---------------------------------------------------------------------
    # 静态资源根目录：交付时按实际路径修改，不要写死开发机绝对路径。
    #   Linux 裸机示例： /opt/rag-assistant/rag-admin/dist
    #   Docker 内：      /usr/share/nginx/html
    # ---------------------------------------------------------------------
    root /usr/share/nginx/html;

    access_log logs/rag-assistant-access.log;
    error_log  logs/rag-assistant-error.log;

    # 必须 ≥ 后端 MAX_FILE_SIZE（backend/routes/knowledge.py 中为 50M），
    # 否则上传大文件会被 Nginx 以 413 拒绝。
    client_max_body_size 100M;

    # 代理超时（SSE 需要较长的读超时）
    proxy_connect_timeout 30s;
    proxy_read_timeout    300s;
    proxy_send_timeout    30s;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;

    # 代理头（location 中未覆盖时会被继承）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------------------------------------------------------------
    # 安全响应头
    # 注意：Nginx 的 add_header 不会被"自带 add_header 的 location"继承。
    # 因此下面的 location 一律只用 expires，不再写 add_header，
    # 以保证这些安全头在所有路径上都生效。
    #
    # X-Frame-Options: SAMEORIGIN 会阻止跨站 iframe 嵌入。
    # 若要把聊天页嵌进客户 OA / 企业微信（跨域 iframe），
    # 请改为按域名放行，例如：
    #   add_header Content-Security-Policy "frame-ancestors https://oa.customer.com" always;
    # 并删除下面这行 X-Frame-Options。
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    # =====================================================================
    # 路由规则
    # =====================================================================

    # 1) 聊天接口：限流 + SSE 全量配置
    #    【注意】location /api/chat 比 /api/ 更具体，Nginx 只会用这一个块，
    #    不会叠加 /api/ 里的设置。所以 SSE 相关指令必须在这里重复一遍，
    #    否则流式输出会被缓冲，表现为"前端一直不动，最后一次性全部出现"。
    location /api/chat {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://rag_python_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE：关闭缓冲，保证逐字返回
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
    }

    # 2) 其余 API -> Python 后端（负载均衡）
    location /api/ {
        proxy_pass http://rag_python_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 3) 带指纹的静态资源 -> 长缓存
    #    只用 expires，不写 add_header，以保留 server 级安全头
    location /assets/ {
        expires 7d;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    # 4) SPA 路由 -> 回落到 index.html（Vue Router history 模式）
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 5) 健康检查（给负载均衡/监控用，不落访问日志）
    location = /health {
        access_log off;
        return 200 "OK\n";
    }

    # =====================================================================
    # 压缩
    # =====================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
}
