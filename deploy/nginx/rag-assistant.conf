# =============================================================================
# RAG 助手 — Nginx 反向代理 + 负载均衡配置
# =============================================================================
# 用途：将前端请求负载均衡到多个 Python 后端实例，提升并发处理能力
# Python 后端实例运行在不同端口（8001, 8011, 8012, ...），由 Nginx 做 upstream 轮询
# 静态资源由 Nginx 直接托管，减少 Python 实例的负载
# =============================================================================
#
# 安装位置建议：
#   Linux:   /etc/nginx/sites-available/rag-assistant.conf
#   Windows: conf/nginx.conf 中 include 此文件
#
# 启动命令：
#   nginx -t                              # 测试配置
#   nginx -s reload                       # 重新加载配置
#
# Python 实例启动：
#   python main.py --port 8001            # 主实例
#   python main.py --port 8011            # 工作实例 1
#   python main.py --port 8012            # 工作实例 2
#   (或使用 deploy/start-python-instances.ps1 一键启动)
# =============================================================================

upstream rag_python_backend {
    # 负载均衡策略：least_conn 将请求分发到活跃连接数最少的后端
    # 相比 round-robin，least_conn 能更均匀地分配长连接和 SSE 流式请求
    least_conn;

    # Python 后端实例列表
    # 主实例（端口 8001）
    server 127.0.0.1:8001 weight=5 max_fails=3 fail_timeout=30s;

    # 工作实例（端口 8011-8014）
    server 127.0.0.1:8011 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8012 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8013 weight=5 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8014 weight=5 max_fails=3 fail_timeout=30s;

    # 健康检查（Nginx Plus 支持主动检查，开源版使用被动检查）
    # 被动检查：max_fails=3 fail_timeout=30s 表示 30s 内失败 3 次则标记为不可用
}

server {
    listen 80;
    server_name localhost rag-assistant.local;

    charset utf-8;

    access_log logs/rag-assistant-access.log;
    error_log  logs/rag-assistant-error.log;

    # 请求体大小限制（支持大文件上传）
    client_max_body_size 100M;

    # 代理超时设置（SSE 流式响应需要较长的超时时间）
    proxy_connect_timeout 30s;
    proxy_read_timeout    300s;
    proxy_send_timeout    30s;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;

    # 代理头设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =========================================================================
    # 路由规则
    # =========================================================================

    # 1. API 路由 -> Python 后端（负载均衡）
    location /api/ {
        proxy_pass http://rag_python_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 流式响应：禁用缓冲，确保流式输出实时到达客户端
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 2. 静态资源 -> Nginx 直接托管（减少 Python 实例负载）
    location /assets/ {
        root D:/RAG-study/rag-admin/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        root D:/RAG-study/rag-admin/dist;
        expires 30d;
    }

    # 3. 前端 SPA 路由 -> 返回 index.html（Vue 3 History 模式）
    location / {
        root D:/RAG-study/rag-admin/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # 安全与性能
    # =========================================================================

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 限制请求速率（基本 DDoS 防护）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    location /api/chat {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://rag_python_backend;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}